# Starts the whole app with one command, from the project root:
#   docker compose up -d --build      (start / update)
#   docker compose logs backend       (see the backend's output)
#   docker compose down               (stop)
#
# Services: backend (FastAPI), nginx (front door), redis (rate limits / cache, used in later items).
# Ollama is NOT in here: for now it runs directly on the PC/server, and the backend reaches it
# through host.docker.internal. Where Ollama is hosted live is decided later.

services:
  backend:
    # Build the image from backend/Dockerfile.
    build: ./backend
    # Settings and secrets (DATABASE_URL_DIRECT, SECRET_KEY, COOKIE_SECURE, ...) come from the root .env,
    # passed in when the container starts; they are never copied into the image.
    env_file: .env
    environment:
      # Inside a container "localhost" is the container itself, so point at the host machine instead.
      # This overrides any OLLAMA_HOST in .env.
      OLLAMA_HOST: http://host.docker.internal:11434
      REDIS_URL: redis://redis:6379/0
    extra_hosts:
      # Docker Desktop (Windows/Mac) knows host.docker.internal already; this line makes it work on Linux too.
      - "host.docker.internal:host-gateway"
    # Port 8000 is only reachable by the other containers (nginx), not from outside.
    expose:
      - "8000"
    depends_on:
      - redis
    # Start again after a crash or a server reboot (unless stopped by hand).
    restart: unless-stopped

  nginx:
    # Built from frontend/Dockerfile: Node builds the React app, then Nginx serves the built files (dist/).
    build: ./frontend
    # The only service open to the outside. 443 (HTTPS) is added with the HTTPS item.
    ports:
      - "80:80"
    volumes:
      # Our config replaces nginx's default site, so nginx/nginx.conf holds `server { ... }` blocks only.
      # :ro = read-only inside the container.
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # No ports: only the backend talks to it, over Docker's internal network (host name "redis").
    volumes:
      # Keep Redis data when the container is replaced.
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data:
